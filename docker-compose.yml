services:
  l2tp:
    image: ${L2TP_IMAGE:-eukhlg/l2tp-go:latest}
    build: .
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1701:1701/udp"
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      - ${L2TP_CONFIG_FILE:-./l2tp-go.toml}:/etc/l2tp-go/server.toml:ro
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      L2TP_CONFIG: /etc/l2tp-go/server.toml
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
