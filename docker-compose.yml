services:
  l2tp:
    build: .
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1701:1701/udp"
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      L2TP_PASSWORD: ${L2TP_PASSWORD:?Set L2TP_PASSWORD before starting}
      L2TP_USERNAME: ${L2TP_USERNAME:-vpn}
      L2TP_LISTEN: ":1701"
      L2TP_HOSTNAME: ${L2TP_HOSTNAME:-l2tp-go}
      L2TP_SERVER_IP: ${L2TP_SERVER_IP:-10.0.0.1}
      L2TP_CLIENT_IP: ${L2TP_CLIENT_IP:-10.0.0.2}
      L2TP_DNS: ${L2TP_DNS:-1.1.1.1}
      L2TP_TUN_ENABLED: "true"
      L2TP_TUN_NAME: ${L2TP_TUN_NAME:-l2tp0}
      L2TP_TUN_PREFIX: ${L2TP_TUN_PREFIX:-10.0.0.1/24}
      L2TP_MTU: ${L2TP_MTU:-1400}
      L2TP_NAT_ENABLED: ${L2TP_NAT_ENABLED:-true}
      L2TP_CLIENT_SUBNET: ${L2TP_CLIENT_SUBNET:-10.0.0.0/24}
      L2TP_NAT_INTERFACE: ${L2TP_NAT_INTERFACE:-eth0}
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
