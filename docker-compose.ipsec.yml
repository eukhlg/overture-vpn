services:
  l2tp:
    # Raw IP protocol 50 cannot be published through Docker's ports mapping.
    # Host networking also lets UDP/500 and the shared UDP/4500 NAT-T socket
    # use the server's public address directly.
    network_mode: host
    ports: !reset []
    cap_add:
      - NET_RAW
    environment:
      L2TP_IPSEC_ENABLED: "true"
