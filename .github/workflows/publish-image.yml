name: Publish selected image (internal)
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      app_branch:
        default: main
        type: string
      l2tp_branch:
        default: main
        type: string
      ipsec_branch:
        default: main
        type: string
      netio_branch:
        default: main
        type: string
      image_name:
        default: ""
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      app_sha: ${{ steps.plan.outputs.app_sha }}
      l2tp_sha: ${{ steps.plan.outputs.l2tp_sha }}
      ipsec_sha: ${{ steps.plan.outputs.ipsec_sha }}
      netio_sha: ${{ steps.plan.outputs.netio_sha }}
      app_ref: ${{ steps.plan.outputs.app_ref }}
      l2tp_ref: ${{ steps.plan.outputs.l2tp_ref }}
      ipsec_ref: ${{ steps.plan.outputs.ipsec_ref }}
      netio_ref: ${{ steps.plan.outputs.netio_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test image selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select image tag and source commits
        id: plan
        env:
          IMAGE_MODE: ${{ inputs.mode }}
          IMAGE_BRANCH: ${{ inputs.app_branch }}
          L2TP_BRANCH: ${{ inputs.l2tp_branch }}
          IPSEC_BRANCH: ${{ inputs.ipsec_branch }}
          NETIO_BRANCH: ${{ inputs.netio_branch }}
          IMAGE_NAME: ${{ inputs.image_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/image_plan.py

  docker:
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ inputs.mode == 'release' && 'stable' || needs.plan.outputs.tag }}
      cancel-in-progress: false
      queue: max
    env:
      GOWORK: "off"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.app_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate stable release version
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | [.id, .tag_name] | @tsv' > /tmp/releases.tsv
          python3 - <<'PYTHON'
          import os, re
          def version(tag):
              match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if not match:
                  raise SystemExit("Stable releases require a numeric version, e.g. v0.4.0")
              return tuple(map(int, match.groups()))
          current = version(os.environ["RELEASE_TAG"])
          if os.environ["PRERELEASE"] == "true":
              raise SystemExit("Prereleases cannot publish latest")
          for line in open("/tmp/releases.tsv"):
              release_id, tag = line.strip().split("\t")
              if release_id != os.environ["RELEASE_ID"] and re.fullmatch(r"v?[0-9]+\.[0-9]+\.[0-9]+", tag):
                  if current <= version(tag):
                      raise SystemExit("Release version must exceed every previous stable release")
          PYTHON

      - name: Select testing module commits
        if: inputs.mode != 'release'
        env:
          L2TP_SHA: ${{ needs.plan.outputs.l2tp_sha }}
          IPSEC_SHA: ${{ needs.plan.outputs.ipsec_sha }}
          NETIO_SHA: ${{ needs.plan.outputs.netio_sha }}
        run: |
          go get -t "github.com/eukhlg/l2tp-go/...@$L2TP_SHA" "github.com/eukhlg/ipsec-go/...@$IPSEC_SHA" "github.com/eukhlg/netio/...@$NETIO_SHA"
          echo "l2tp_go=$L2TP_SHA" >> "$GITHUB_ENV"
          echo "ipsec_go=$IPSEC_SHA" >> "$GITHUB_ENV"
          echo "netio=$NETIO_SHA" >> "$GITHUB_ENV"

      - name: Test L2TP
        run: go test -race github.com/eukhlg/l2tp-go/...

      - name: Test IPsec
        run: go test -race github.com/eukhlg/ipsec-go/...

      - name: Test netio
        run: go test -race github.com/eukhlg/netio/...

      - name: Test application
        run: |
          go test -race ./...
          go vet ./...

      - name: Record dependency versions
        env:
          GOWORK: "off"
          APP_SHA: ${{ needs.plan.outputs.app_sha }}
        run: |
          go list -m all >> "$GITHUB_STEP_SUMMARY"
          echo "Application commit: $APP_SHA" >> "$GITHUB_STEP_SUMMARY"
          for module in l2tp-go ipsec-go netio; do
            key=${module//-/_}
            version=$(go list -m -f '{{.Version}}' "github.com/eukhlg/$module")
            echo "${key}_version=$version" >> "$GITHUB_ENV"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/eukhlg/overture-vpn
            docker.io/eukhlg/overture-vpn
            ghcr.io/eukhlg/l2tp-go
            docker.io/eukhlg/l2tp-go
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }},enable=${{ inputs.mode != 'release' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ inputs.mode == 'release' }}
            type=raw,value=latest,enable=${{ inputs.mode == 'release' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.app_sha }}
            io.overture.l2tp-go.revision=${{ env.l2tp_go }}
            io.overture.ipsec-go.revision=${{ env.ipsec_go }}
            io.overture.netio.revision=${{ env.netio }}
            io.overture.app.branch=${{ needs.plan.outputs.app_ref }}
            io.overture.l2tp-go.branch=${{ needs.plan.outputs.l2tp_ref }}
            io.overture.ipsec-go.branch=${{ needs.plan.outputs.ipsec_ref }}
            io.overture.netio.branch=${{ needs.plan.outputs.netio_ref }}
            io.overture.l2tp-go.version=${{ env.l2tp_go_version }}
            io.overture.ipsec-go.version=${{ env.ipsec_go_version }}
            io.overture.netio.version=${{ env.netio_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
