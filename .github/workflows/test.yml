name: Test Overture VPN
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test source selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Download committed dependencies
        run: go mod download
      - run: go test -race ./...
      - run: go vet ./...
