name: Test Overture VPN
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test image source and tag selection
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        env:
          GOWORK: "off"
      - run: go vet ./...
        env:
          GOWORK: "off"
