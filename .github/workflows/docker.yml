name: Build and publish Overture VPN images

on:
  push:
    branches: ["**"]
  repository_dispatch:
    types: [module-push]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      feature:
        description: Feature name for testing-<feature>
        required: true
        type: string
      app_ref:
        description: Overture branch (or refs/tags/<tag>)
        default: main
        type: string
      l2tp_ref:
        description: L2TP branch (or refs/tags/<tag>)
        default: main
        type: string
      ipsec_ref:
        description: IPsec branch (or refs/tags/<tag>)
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  plan:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      app_sha: ${{ steps.plan.outputs.app_sha }}
      l2tp_sha: ${{ steps.plan.outputs.l2tp_sha }}
      ipsec_sha: ${{ steps.plan.outputs.ipsec_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Select image tag and source commits
        id: plan
        run: python3 .github/scripts/image_plan.py

  docker:
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ needs.plan.outputs.tag }}
      cancel-in-progress: true
    env:
      GOWORK: "off"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.app_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate stable release version
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | [.id, .tag_name] | @tsv' > /tmp/releases.tsv
          python3 - <<'PYTHON'
          import os, re
          def version(tag):
              match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if not match:
                  raise SystemExit("Stable releases require a numeric version, e.g. v0.4.0")
              return tuple(map(int, match.groups()))
          current = version(os.environ["RELEASE_TAG"])
          if os.environ["PRERELEASE"] == "true":
              raise SystemExit("Prereleases cannot publish latest")
          for line in open("/tmp/releases.tsv"):
              release_id, tag = line.strip().split("\t")
              if release_id != os.environ["RELEASE_ID"] and re.fullmatch(r"v?[0-9]+\.[0-9]+\.[0-9]+", tag):
                  if current <= version(tag):
                      raise SystemExit("Release version must exceed every previous stable release")
          PYTHON

      - name: Select testing module commits
        if: github.event_name != 'release'
        env:
          L2TP_SHA: ${{ needs.plan.outputs.l2tp_sha }}
          IPSEC_SHA: ${{ needs.plan.outputs.ipsec_sha }}
        run: |
          go get "github.com/eukhlg/l2tp-go@$L2TP_SHA" "github.com/eukhlg/ipsec-go@$IPSEC_SHA"
          echo "l2tp_go=$L2TP_SHA" >> "$GITHUB_ENV"
          echo "ipsec_go=$IPSEC_SHA" >> "$GITHUB_ENV"

      - name: Test selected application and modules
        env:
          GOWORK: "off"
        run: |
          go test -race ./... github.com/eukhlg/l2tp-go/... github.com/eukhlg/ipsec-go/...
          go vet ./...

      - name: Record dependency versions
        env:
          GOWORK: "off"
          APP_SHA: ${{ needs.plan.outputs.app_sha }}
        run: |
          go list -m all >> "$GITHUB_STEP_SUMMARY"
          echo "Application commit: $APP_SHA" >> "$GITHUB_STEP_SUMMARY"
          for module in l2tp-go ipsec-go; do
            key=${module//-/_}
            version=$(go list -m -f '{{.Version}}' "github.com/eukhlg/$module")
            echo "${key}_version=$version" >> "$GITHUB_ENV"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/eukhlg/overture-vpn
            docker.io/eukhlg/overture-vpn
            ghcr.io/eukhlg/l2tp-go
            docker.io/eukhlg/l2tp-go
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.tag }},enable=${{ github.event_name != 'release' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.app_sha }}
            io.overture.l2tp-go.revision=${{ env.l2tp_go }}
            io.overture.ipsec-go.revision=${{ env.ipsec_go }}
            io.overture.l2tp-go.version=${{ env.l2tp_go_version }}
            io.overture.ipsec-go.version=${{ env.ipsec_go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
